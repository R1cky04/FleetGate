services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anaconda123
      POSTGRES_DB: FleetGate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleetgate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetgate-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:anaconda123@postgres:5432/FleetGate?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: change-me
      JWT_EXPIRES_IN: 8h
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleetgate-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: fleetgate-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - fleetgate-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: fleetgate-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - fleetgate-network

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  fleetgate-network:
    driver: bridge
