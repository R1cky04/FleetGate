services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: anaconda123
      POSTGRES_DB: FleetGate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fleetgate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetgate-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:anaconda123@postgres:5432/FleetGate?schema=public
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fleetgate-network

volumes:
  postgres_data:
    driver: local

networks:
  fleetgate-network:
    driver: bridge
